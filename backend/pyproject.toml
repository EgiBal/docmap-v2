[project]
name = "docmap"
version = "0.1.0"
description = "DocMap: office docs to lean Markdown, topic map, review UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "firecrawl-anydoc==0.2.5",
    "httpx>=0.28.1",
    "markitdown[docx,xlsx,pdf,pptx]==0.1.9",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlmodel>=0.0.50",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
]
