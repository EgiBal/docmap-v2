<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One review action</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #ffffff; --ink: #17171c; --muted: #616161; --soft: #93939f; --rule: #d9d9dd; --accent: #ff7759; --link: #003c33; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 48px 20px; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin: 0 0 8px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 400; font-size: 2.25rem; letter-spacing: -0.02em; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 28px; max-width: 640px; }
  svg { display: block; width: 100%; height: auto; }
  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--rule); font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--soft); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">DocMap · architecture</p>
  <h1>One review action</h1>
  <p class="sub">A reviewer's decision is saved with <code>source = human</code>, and every later AI run leaves it alone.</p>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 712" role="img" aria-labelledby="review-action-title review-action-desc">
  <title id="review-action-title">One review action in DocMap</title>
  <desc id="review-action-desc">Sequence diagram: a reviewer accepts, rejects or moves a link, the UI sends PATCH /api/links/{id}, FastAPI stores the decision with source set to human, and the updated link returns to the UI; when the pipeline runs again, save_run keeps every human-set link and matches topics to the old ones so their ids stay stable.</desc>
  <defs>
    <marker id="ra-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#616161"/></marker>
    <marker id="ra-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff7759"/></marker>
    <marker id="ra-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#003c33"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Lifelines -->
  <g stroke="rgba(23,23,28,0.20)" stroke-width="1" stroke-dasharray="3,3">
    <line x1="110" y1="104" x2="110" y2="644"/>
    <line x1="290" y1="104" x2="290" y2="644"/>
    <line x1="470" y1="104" x2="470" y2="644"/>
    <line x1="650" y1="104" x2="650" y2="644"/>
    <line x1="830" y1="104" x2="830" y2="644"/>
  </g>

  <!-- OPT fragment: a later pipeline run -->
  <rect x="568" y="440" width="324" height="184" rx="4" fill="rgba(23,23,28,0.02)" stroke="rgba(23,23,28,0.22)" stroke-width="1"/>
  <rect x="568" y="440" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(23,23,28,0.22)" stroke-width="1"/>
  <text x="588" y="452" fill="#616161" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
  <rect x="612" y="443" width="172" height="12" rx="2" fill="#ffffff"/>
  <text x="616" y="452" fill="#616161" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[the user runs the pipeline again]</text>

  <!-- Activation bars -->
  <g fill="rgba(23,23,28,0.06)" stroke="#616161" stroke-width="0.8">
    <rect x="286" y="150" width="8" height="270"/>
    <rect x="466" y="190" width="8" height="190"/>
    <rect x="646" y="230" width="8" height="110"/>
    <rect x="826" y="496" width="8" height="96"/>
    <rect x="646" y="496" width="8" height="96"/>
  </g>

  <!-- Messages (drawn before actor boxes) -->
  <!-- 1. Reviewer presses a key -->
  <line x1="110" y1="160" x2="285" y2="160" stroke="#616161" stroke-width="1.2" marker-end="url(#ra-arrow)"/>
  <rect x="162" y="142" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="198" y="151" fill="#616161" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRESS A/R/M</text>

  <!-- 2. UI -> API: PATCH -->
  <line x1="294" y1="200" x2="465" y2="200" stroke="#003c33" stroke-width="1.2" marker-end="url(#ra-arrow-link)"/>
  <rect x="348" y="182" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="380" y="191" fill="#003c33" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PATCH LINK</text>

  <!-- 3. API -> store -->
  <line x1="474" y1="240" x2="645" y2="240" stroke="#616161" stroke-width="1.2" marker-end="url(#ra-arrow)"/>
  <rect x="516" y="222" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="560" y="231" fill="#616161" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HUMAN_SET_LINK</text>

  <!-- 4. Store self-message: source = human (focal) -->
  <path d="M654 260 H686 A8 8 0 0 1 694 268 V280 A8 8 0 0 1 686 288 H655" fill="none" stroke="#ff7759" stroke-width="1.4" marker-end="url(#ra-arrow-accent)"/>
  <text x="708" y="271" fill="#ff7759" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SOURCE = HUMAN</text>
  <text x="708" y="283" fill="#616161" font-size="8" font-family="'Geist Mono', monospace">status updated</text>

  <!-- 5. Store -> API return -->
  <line x1="646" y1="324" x2="475" y2="324" stroke="#616161" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ra-arrow)"/>
  <rect x="522" y="306" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="560" y="315" fill="#616161" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPDATED LINK</text>

  <!-- 6. API -> UI return -->
  <line x1="466" y1="364" x2="295" y2="364" stroke="#616161" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ra-arrow)"/>
  <rect x="348" y="346" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="380" y="355" fill="#616161" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 + LINK</text>

  <!-- 7. UI -> Reviewer -->
  <line x1="286" y1="404" x2="111" y2="404" stroke="#616161" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ra-arrow)"/>
  <rect x="166" y="386" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="198" y="395" fill="#616161" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW STATUS</text>

  <!-- 8. Pipeline -> store: save_run -->
  <line x1="826" y1="504" x2="655" y2="504" stroke="#616161" stroke-width="1.2" marker-end="url(#ra-arrow)"/>
  <rect x="712" y="486" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="740" y="495" fill="#616161" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE_RUN</text>

  <!-- 9. Store self-message: keep human links (focal) -->
  <path d="M654 524 H686 A8 8 0 0 1 694 532 V544 A8 8 0 0 1 686 552 H655" fill="none" stroke="#ff7759" stroke-width="1.4" marker-end="url(#ra-arrow-accent)"/>
  <text x="708" y="535" fill="#ff7759" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.06em">KEEP HUMAN</text>
  <text x="708" y="547" fill="#616161" font-size="8" font-family="'Geist Mono', monospace">skip source = human</text>

  <!-- 10. Store -> Pipeline return -->
  <line x1="654" y1="588" x2="825" y2="588" stroke="#616161" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ra-arrow)"/>
  <rect x="696" y="570" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="740" y="579" fill="#616161" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOPIC IDS KEPT</text>
  <rect x="576" y="603" width="248" height="12" rx="2" fill="#ffffff"/>
  <text x="580" y="612" fill="#616161" font-size="8" font-family="'Geist Mono', monospace">topics matched to old ones by embedding similarity</text>

  <!-- Actor boxes -->
  <!-- Reviewer (input / user) -->
  <rect x="40" y="40" width="140" height="64" rx="6" fill="#ffffff"/>
  <rect x="40" y="40" width="140" height="64" rx="6" fill="rgba(97,97,97,0.08)" stroke="#93939f" stroke-width="1"/>
  <rect x="48" y="46" width="32" height="12" rx="2" fill="none" stroke="rgba(147,147,159,0.5)" stroke-width="0.8"/>
  <text x="64" y="55" fill="#616161" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="110" y="80" fill="#17171c" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Reviewer</text>
  <text x="110" y="94" fill="#616161" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">review queue / map</text>

  <!-- Next.js UI -->
  <rect x="220" y="40" width="140" height="64" rx="6" fill="#ffffff" stroke="#17171c" stroke-width="1"/>
  <rect x="228" y="46" width="24" height="12" rx="2" fill="none" stroke="rgba(23,23,28,0.4)" stroke-width="0.8"/>
  <text x="240" y="55" fill="#17171c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
  <text x="290" y="80" fill="#17171c" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Next.js UI</text>
  <text x="290" y="94" fill="#616161" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">review/page.tsx</text>

  <!-- FastAPI -->
  <rect x="400" y="40" width="140" height="64" rx="6" fill="#ffffff" stroke="#17171c" stroke-width="1"/>
  <rect x="408" y="46" width="28" height="12" rx="2" fill="none" stroke="rgba(23,23,28,0.4)" stroke-width="0.8"/>
  <text x="422" y="55" fill="#17171c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="470" y="80" fill="#17171c" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">FastAPI</text>
  <text x="470" y="94" fill="#616161" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/links/{id}</text>

  <!-- SQLite store -->
  <rect x="580" y="40" width="140" height="64" rx="6" fill="#ffffff"/>
  <rect x="580" y="40" width="140" height="64" rx="6" fill="rgba(23,23,28,0.05)" stroke="#616161" stroke-width="1"/>
  <rect x="588" y="46" width="24" height="12" rx="2" fill="none" stroke="rgba(97,97,97,0.5)" stroke-width="0.8"/>
  <text x="600" y="55" fill="#616161" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
  <text x="650" y="80" fill="#17171c" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">SQLite store</text>
  <text x="650" y="94" fill="#616161" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">store.py</text>

  <!-- Pipeline (later, optional) -->
  <rect x="760" y="40" width="140" height="64" rx="6" fill="#ffffff"/>
  <rect x="760" y="40" width="140" height="64" rx="6" fill="rgba(23,23,28,0.02)" stroke="rgba(23,23,28,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="768" y="46" width="28" height="12" rx="2" fill="none" stroke="rgba(23,23,28,0.3)" stroke-width="0.8"/>
  <text x="782" y="55" fill="#616161" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
  <text x="830" y="80" fill="#17171c" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Pipeline</text>
  <text x="830" y="94" fill="#616161" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">next AI run</text>

  <!-- Legend -->
  <line x1="40" y1="664" x2="900" y2="664" stroke="rgba(23,23,28,0.10)" stroke-width="0.8"/>
  <text x="40" y="688" fill="#616161" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="120" y1="685" x2="148" y2="685" stroke="#003c33" stroke-width="1.2" marker-end="url(#ra-arrow-link)"/>
  <text x="156" y="688" fill="#616161" font-size="8" font-family="'Geist Mono', monospace">HTTP call</text>
  <line x1="260" y1="685" x2="288" y2="685" stroke="#616161" stroke-width="1.2" marker-end="url(#ra-arrow)"/>
  <text x="296" y="688" fill="#616161" font-size="8" font-family="'Geist Mono', monospace">call</text>
  <line x1="380" y1="685" x2="408" y2="685" stroke="#616161" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ra-arrow)"/>
  <text x="416" y="688" fill="#616161" font-size="8" font-family="'Geist Mono', monospace">return</text>
  <line x1="500" y1="685" x2="528" y2="685" stroke="#ff7759" stroke-width="1.4" marker-end="url(#ra-arrow-accent)"/>
  <text x="536" y="688" fill="#616161" font-size="8" font-family="'Geist Mono', monospace">human decision protected</text>
</svg>

  <footer>DocMap · docs/diagrams/review-action.html</footer>
</main>
</body>
</html>
